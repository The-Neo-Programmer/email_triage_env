[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-env"
version = "1.0.0"
description = "Real-world RL environment for email triage tasks — OpenEnv framework"
authors = [
    {name = "Anurag Mukherjee", email = "The-Neo-Programmer@hf.com"}
]
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.3,<0.3.0",
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn>=0.30.0,<0.35.0",
    "pydantic>=2.7.0,<3.0.0",
    "openai>=1.30.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.27.0,<0.29.0",
    "python-multipart>=0.0.9,<0.1.0"
]

[tool.setuptools]
packages = ["server"]
py-modules = ["models", "client", "inference"]

[tool.setuptools.package-data]
"*" = ["data/*.json"]

[project.scripts]
server = "server.app:main"
