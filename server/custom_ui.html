<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Triage - OpenEnv Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151b2b;
            --bg-accent: #1e263d;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar */
        header {
            background: rgba(21, 27, 43, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            gap: 24px;
            font-size: 0.9rem;
        }

        .stat-box {
            background: var(--bg-accent);
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-weight: 600;
            color: var(--success);
        }

        /* Main Content */
        main {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            padding: 24px;
            flex-grow: 1;
            height: calc(100vh - 70px);
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .panel-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Email View */
        .email-container {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .email-meta {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .email-subject {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #fff;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .sender-badge {
            background: var(--bg-accent);
            padding: 2px 8px;
            border-radius: 4px;
            color: #93c5fd;
        }

        .email-body {
            line-height: 1.6;
            white-space: pre-wrap;
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            opacity: 0.6;
        }

        /* Controller View */
        .task-instructions {
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            font-size: 0.9rem;
            color: #bfdbfe;
            line-height: 1.5;
        }

        .chat-history {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            background: var(--bg-accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            border-left: 3px solid var(--primary);
        }

        .log-entry.system {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .controls {
            padding: 16px;
            background: var(--bg-accent);
            border-top: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            min-height: 100px;
            resize: vertical;
            margin-bottom: 12px;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-accent);
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            📧 Email Triage OpenEnv
        </div>
        <div class="stats">
            <div class="stat-box">Task: <span class="stat-value" id="ui-task">None</span></div>
            <div class="stat-box">Score: <span class="stat-value" id="ui-score">0.00</span></div>
            <div class="stat-box">Done: <span class="stat-value" id="ui-done">False</span></div>
        </div>
    </header>

    <main>
        <div class="panel">
            <div class="panel-header">
                Active Email View
            </div>
            <div class="email-container" id="email-view">
                <div class="placeholder">
                    <h2>Environment is Offline</h2>
                    <p style="margin-top: 10px;">Click "Start / Reset Episode" to initialize the task.</p>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                Agent Interface
            </div>
            <div class="task-instructions" id="instructions-view">
                Instructions will appear here once an episode starts.
            </div>
            <div class="chat-history" id="chat">
                <!-- Logs will appear here -->
            </div>
            <div class="controls">
                <textarea id="action-input" placeholder="Enter your model's response (JSON or text) here..."></textarea>
                <div class="btn-group">
                    <button class="btn-secondary" id="btn-reset" onclick="resetEnv()">
                        <div class="loader" id="loader-reset"></div>
                        Start / Reset
                    </button>
                    <button class="btn-primary" id="btn-step" onclick="stepEnv()" disabled>
                        <div class="loader" id="loader-step"></div>
                        Submit Action
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Use origin-based API base so Spaces/proxy path quirks do not break calls.
        const API_BASE = window.location.origin;

        function logEvent(text, isSystem = false) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `log-entry ${isSystem ? 'system' : ''}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateUI(obs, reward, done) {
            if (!obs) return;

            document.getElementById('ui-task').innerText = obs.task || 'Unknown';
            document.getElementById('ui-score').innerText = (obs.last_score || 0).toFixed(2);
            document.getElementById('ui-done').innerText = done ? 'True' : 'False';

            document.getElementById('instructions-view').innerText = obs.instructions || 'No instructions provided.';

            const emailView = document.getElementById('email-view');
            
            if (obs.email_subject) {
                emailView.innerHTML = `
                    <div class="email-meta">
                        <div class="email-subject">${obs.email_subject}</div>
                        <div class="meta-row">
                            <span>From: <span class="sender-badge">${obs.sender}</span></span>
                            <span>${obs.timestamp}</span>
                        </div>
                    </div>
                    <div class="email-body">${obs.email_body}</div>
                `;
            }

            if (obs.feedback) {
                logEvent(`Feedback: ${obs.feedback}`, true);
            }

            const btnStep = document.getElementById('btn-step');
            const input = document.getElementById('action-input');
            
            if (done) {
                btnStep.disabled = true;
                input.disabled = true;
                logEvent("Episode finished! Reset to start a new task.", true);
            } else {
                btnStep.disabled = false;
                input.disabled = false;
                input.value = "";
                input.focus();
            }
        }

        async function safeFetch(url, options) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP Error ${response.status} at ${url}: ${text}`);
                }
                return await response.json();
            } catch (err) {
                logEvent(`Network/API Error: ${err.message}`, true);
                throw err;
            }
        }

        async function resetEnv() {
            logEvent("Initializing environment sequence (reset)...", true);
            document.getElementById('loader-reset').style.display = 'block';
            document.getElementById('btn-reset').disabled = true;

            try {
                const data = await safeFetch(`${API_BASE}/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                document.getElementById('chat').innerHTML = ''; // clear logs
                logEvent("Reset successful. New email injected.", true);
                updateUI(data.observation, data.reward, data.done);

            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loader-reset').style.display = 'none';
                document.getElementById('btn-reset').disabled = false;
            }
        }

        async function stepEnv() {
            const val = document.getElementById('action-input').value.trim();
            if (!val) return;

            logEvent(`>> Agent Action: ${val}`);
            
            document.getElementById('loader-step').style.display = 'block';
            document.getElementById('btn-step').disabled = true;

            try {
                const payload = { action: { content: val } };
                const data = await safeFetch(`${API_BASE}/step`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                logEvent(`Reward Delta: ${(data.reward || 0).toFixed(2)}`, true);
                updateUI(data.observation, data.reward, data.done);

            } catch (err) {
                console.error(err);
                document.getElementById('btn-step').disabled = false; // re-enable on error
            } finally {
                document.getElementById('loader-step').style.display = 'none';
            }
        }
    </script>
</body>
</html>
